# Spring Boot Application Properties
spring.application.name=thumblify-server

# Port from .env (defaults to 5000)
server.port=${PORT:5000}

# MongoDB Connection String from .env
MONGO_URI=${MONGO_URI:mongodb://127.0.0.1:27017/thumblify}

# Allow large payloads (up to 15MB) for base64 subject image upload
spring.servlet.multipart.max-file-size=15MB
spring.servlet.multipart.max-request-size=15MB
server.tomcat.max-swallow-size=15MB
server.tomcat.max-http-form-post-size=15MB

# Logging
logging.level.root=INFO
logging.level.com.thumblify=DEBUG
logging.level.org.springframework.security=WARN
